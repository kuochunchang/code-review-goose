name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run linter
      run: npm run lint

    - name: Build all packages
      run: npm run build

    - name: Run tests
      run: npm run test
      continue-on-error: true

  # Note: VS Code Extension is published manually using 'vsce publish'
  # No npm packages are published - all packages are internal dependencies
  # To publish VS Code Extension:
  #   1. cd packages/vscode-extension
  #   2. npm run build
  #   3. npm run package
  #   4. npx vsce publish
